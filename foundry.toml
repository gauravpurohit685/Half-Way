[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@reactive-lib-omni/=lib/reactive-lib-omni/src/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
sepolia = "${RPC_SEPOLIA}"
base_sepolia = "${RPC_BASE_SEPOLIA}"
unichain_sepolia = "${RPC_UNICHAIN_SEPOLIA}"
reactive_lasna = "${RPC_REACTIVE_LASNA}"
